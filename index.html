      (function () {
        var ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('kakaotalk') !== -1) {
          location.href =
            'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
        }
      })();
    </script>
